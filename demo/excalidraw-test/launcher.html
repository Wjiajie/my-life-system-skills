<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Excalidraw Launcher</title>
  <style>
    html, body, #app { height: 100%; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; }
    #err { padding: 24px; color: #b00; font-family: monospace; white-space: pre-wrap; }
    #loading { padding: 24px; color: #666; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Loading Excalidraw…</div>
  <div id="err"></div>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime"
    }
  }
  </script>
  <script type="module">
    import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom";
    import React from "https://esm.sh/react@18";
    import ReactDOM from "https://esm.sh/react-dom@18";

    const params = new URLSearchParams(location.search);
    const file = params.get("file") || "release-pipeline.excalidraw";

    try {
      const r = await fetch(file);
      if (!r.ok) throw new Error(`HTTP ${r.status} loading ${file}`);
      const initialData = await r.json();
      console.log("[launcher] loaded", file, "type=" + initialData.type, "elements=" + (initialData.elements?.length ?? 0), "appState keys=" + Object.keys(initialData.appState || {}).join(","));

      // Force a sane initial viewport: center the content area and set a known zoom.
      // Excalidraw's default scrollX/Y/zoom are 0/0/null which leaves you staring
      // at empty space when content is offset.
      initialData.appState = {
        ...(initialData.appState || {}),
        scrollX: 0,
        scrollY: 0,
        zoom: { value: 0.8 },
      };

      document.getElementById("loading").remove();

      // Excalidraw expects initialData.type === "excalidraw"
      // excalidrawAPI prop in 0.18 is a callback (api) => void, not a ref
      let excalidrawAPI = null;
      const onAPIAvailable = (api) => {
        excalidrawAPI = api;
        const fit = () => {
          if (!excalidrawAPI) return;
          const els = excalidrawAPI.getSceneElements();
          if (els && els.length) {
            excalidrawAPI.scrollToContent(els, {
              fitToViewport: true,
              viewportZoomFactor: 0.85,
            });
          }
        };
        setTimeout(fit, 100);
        setTimeout(fit, 600);
        setTimeout(fit, 1500);
      };

      ReactDOM.createRoot(document.getElementById("app")).render(
        React.createElement(Excalidraw, {
          initialData,
          autoFocus: true,
          excalidrawAPI: onAPIAvailable,
        })
      );
    } catch (e) {
      document.getElementById("loading").remove();
      document.getElementById("err").textContent =
        "Excalidraw load failed: " + e.message +
        "\n\nMake sure the local server is still running and the .excalidraw file exists in the same directory as this HTML.";
      console.error(e);
    }
  </script>
</body>
</html>
