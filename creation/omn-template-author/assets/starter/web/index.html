<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建立潮汐观测档案</title><link rel="modulepreload" href="./omn-template.mjs"><link rel="stylesheet" href="./views.css"></head>
<body><main><p class="eyebrow">TIDAL FIELDNOTES · 01</p><h1>接手一座海岸观测站</h1><p>写下站点与任务，故事将从下一次潮水到达时开始。</p>
<form id="station-form"><label>观测站名称<input name="station" value="白礁站" required maxlength="40"></label><label>所处海岸<input name="coast" value="岬角以东的碎石海岸" required maxlength="100"></label><label>观测员<input name="observer" value="陈汐" required maxlength="40"></label><label>当前潮况<select name="tide"><option>涨潮</option><option>退潮</option><option>平潮</option></select></label><label>本次任务<textarea name="mission" required minlength="2" maxlength="300">修复失灵的浮标，查明昨夜异常潮位的来源。</textarea></label><button type="submit">提交观测档案</button></form><p id="status" role="status"></p></main><script type="module" src="./initialization.mjs"></script></body></html>
